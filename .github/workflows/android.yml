# Compila o app Android do Anamnesia (pasta android/) e publica o .apk.
# - Em qualquer ramo: o .apk fica nos "Artifacts" da execução.
# - No main: também vai para a versão "android" em Releases, com link fixo para baixar no celular:
#   https://github.com/geradorevolucao/isbar_uti/releases/download/android/anamnesia.apk
name: App Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Chave de assinatura (segredo do repositório, se existir)
        env:
          KS_B64: ${{ secrets.ANAMNESIA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > android/app/release.keystore; echo "Assinando com a chave do repositório."; else echo "Sem segredo: assinatura de depuração (muda a cada build)."; fi

      - name: Compilar
        env:
          ANAMNESIA_KS_PASS: ${{ secrets.ANAMNESIA_KS_PASS }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk anamnesia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: anamnesia-apk
          path: anamnesia.apk

      - name: Publicar em Releases (só no main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "App Android do Anamnesia" --notes "Baixe o anamnesia.apk abaixo e instale no celular ou tablet. Cada versão nova instala por cima da anterior."
          gh release upload android anamnesia.apk --clobber
